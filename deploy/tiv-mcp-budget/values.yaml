# Default values for tiv-mcp-budget.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: placeholder
  tag: "placeholder"
  pullPolicy: Always
  imagePullSecrets: ["registry-regcred"]
# Every setting comes from a Kubernetes secret that is created outside this repository.
# Nothing environment-specific (URLs, tenants, audiences) is committed here.
env:
  - name: MCPAPP__TIVAPIBASEURL
    valueFrom:
      secretKeyRef:
        name: tiv-mcp-budget-secrets
        key: MCPAPP__TIVAPIBASEURL
  - name: MCPAPP__TIVAGENTAPIBASEURL
    valueFrom:
      secretKeyRef:
        name: tiv-mcp-budget-secrets
        key: MCPAPP__TIVAGENTAPIBASEURL
  - name: MCPAPP__STSAUTHORITY
    valueFrom:
      secretKeyRef:
        name: tiv-mcp-budget-secrets
        key: MCPAPP__STSAUTHORITY
  - name: MCPAPP__STSAUDIENCE
    valueFrom:
      secretKeyRef:
        name: tiv-mcp-budget-secrets
        key: MCPAPP__STSAUDIENCE
  - name: ASPNETCORE_ENVIRONMENT
    valueFrom:
      secretKeyRef:
        name: tiv-mcp-budget-secrets
        key: MCPAPP__ASPNETCORE_ENVIRONMENT
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  internalPort: 8080

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
